# Пустое описание нового PR заполняется по diff и коммитам; любой сбой ничего не меняет.
name: PR text
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  text:
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Tiny LLM-call job: GitHub-hosted is enough, keep Blacksmith for builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: Blockfield/blockfield-workspace/.github/actions/release-text@3cc4cface7090e3306d341341c402f3d7fe8ba0a
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_TEXT_MODEL: ${{ vars.RELEASE_TEXT_MODEL }}
        with:
          mode: pr
