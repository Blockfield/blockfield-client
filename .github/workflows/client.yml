name: Client pack
on:
  push:
    branches: [main]
    tags: ["v*"]
  # Bot-gate (enforcing): PR CI runs only when the GitHub App
  # `blockfield-review-bot[bot]` approves the CURRENT head SHA. Pushes to a PR
  # branch fire no workflow run at all; only the bot's APPROVED `pull_request_review`
  # (submitted) starts a runner. Any other review matches the trigger but skips
  # every job at the job-level `if:`, so the run is all-skipped and bills
  # 0 minutes. A stale approval (push between the
  # review and the run) is rejected by the commit_id == head SHA check below.
  # Draft PRs get no bot verdict, so no CI runs until the PR is marked ready.
  # Merge protection pairs this gate with the bot's own `bot-review` commit
  # status on the head SHA (success = approved, failure = changes requested):
  # require `bot-gate` + `check` + `bot-review` on main (see task report).
  pull_request_review:
    types: [submitted]
  # Maintainer-only manual override (no bot verdict needed): run it from the
  # PR branch and record why. Ordinary contributors cannot bypass the gate
  # with this; misuse is visible in the run history.
  workflow_dispatch:
    inputs:
      release_text_tag:
        description: "Published client tag (vX.Y.Z) whose notes to regenerate; never rebuilds the pack"
        required: false
        default: ""
      reason:
        description: "Override reason (maintainers only)"
        required: true
        type: string
permissions:
  contents: read
  actions: read # main-push path looks up the green check run for this tree
  pull-requests: read # bot-gate reads blockfield-review-bot verdicts on the head SHA
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'pull_request_review' && (github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'review-noise' || 'gate' }}
  # A review must never cancel the run it gates; pushes to main queue behind
  # the running one instead of cancelling it. Queued runs each evaluate their
  # own event's head SHA and attach their results there, so a stale-head run
  # can never report green on the current head.
  cancel-in-progress: false
jobs:
  bot-gate:
    name: ${{ (github.event_name == 'pull_request_review' && (github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'bot-gate (skipped review)' || 'bot-gate' }}
    # Enforcing: `check` runs on a PR head only when this job reports
    # verdict=permit with sha_match=true for the CURRENT head SHA, resolved
    # from the API at gate runtime (a push may have landed after the
    # triggering review event was created; the event payload would still name
    # the old head). The event head must equal the runtime head, and the
    # bot's latest verdict-bearing review on that SHA must be APPROVED.
    # Anything else (stale event, no verdict yet, REQUEST_CHANGES, DISMISSED,
    # a verdict on an older SHA) skips `check`, so the gate fails closed.
    # Always exits 0: denial is expressed through the outputs, and the bot's
    # own `bot-review` commit status blocks merge.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request_review' && github.event.review.user.login == 'blockfield-review-bot[bot]' && github.event.review.state == 'approved'
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
      sha_match: ${{ steps.gate.outputs.sha_match }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Evaluate blockfield-review-bot verdict for the current PR head SHA
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          bot='blockfield-review-bot[bot]'
          repo="${{ github.repository }}"
          # Current head, not the event snapshot: the review that triggered
          # this run may predate a newer push. Only the still-current head
          # may pass; a stale event waits for the newer review's run.
          HEAD_SHA=$(gh api "repos/$repo/pulls/$PR_NUMBER" --jq '.head.sha')
          verdict=deny-awaiting
          sha_match=false
          if [ "$EVENT_SHA" = "$HEAD_SHA" ]; then
            # Latest verdict-bearing bot review on the current head,
            # aggregated across API pages (gh --jq applies per page).
            # COMMENTED reviews carry no verdict and are excluded, so a later
            # comment cannot override an earlier verdict. (jq is preinstalled
            # on the runner. The head SHA is spliced in; gh --jq takes no
            # variable arguments.)
            state=$(gh api "repos/$repo/pulls/$PR_NUMBER/reviews" --paginate               --jq '[.[] | select(.user.login == "'"$bot"'" and .commit_id == "'"$HEAD_SHA"'")]'               | jq -r -s '[add[] | select(.state != "COMMENTED")] | sort_by(.id) | last | .state // empty')
            # The API returns uppercase states ("APPROVED"); normalize anyway.
            state=$(printf '%s' "$state" | tr '[:lower:]' '[:upper:]')
            case "$state" in
              APPROVED)
                verdict=permit
                sha_match=true
                ;;
              # CHANGES_REQUESTED -> deny; DISMISSED / empty stay
              # deny-awaiting (fail-closed).
              CHANGES_REQUESTED) verdict=deny ;;
            esac
          fi
          # `sha` always names the evaluated runtime head so logs and the
          # checkout below agree on what was gated.
          echo "event=${EVENT_SHA:0:12} head=${HEAD_SHA:0:12} bot_state=${state:-none} verdict=$verdict sha_match=$sha_match"
          {
            echo "verdict=$verdict"
            echo "sha_match=$sha_match"
            echo "sha=$HEAD_SHA"
          } >> "$GITHUB_OUTPUT"
  check:
    name: ${{ (github.event_name == 'pull_request_review' && (github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'check (skipped review)' || 'check' }}
    # Notes-regeneration dispatches skip the build; main/tag pushes and other
    # maintainer dispatches always run; PR heads run only on a gate permit
    # for the exact head SHA. `always()` keeps push CI working even though
    # `bot-gate` is skipped on push.
    needs: [bot-gate]
    if: always() && inputs.release_text_tag == '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (needs.bot-gate.outputs.verdict == 'permit' && needs.bot-gate.outputs.sha_match == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_review' && needs.bot-gate.outputs.sha || github.sha }}
          persist-credentials: false
          # `${{ cond && 0 || 1 }}` is always 1: 0 is falsy, and the pin check needs the tags of the range.
          fetch-depth: 0
          fetch-tags: true
      # Main pushes usually merge a tree a green PR run already tested; tags always run full.
      # Review runs check out the head SHA (pinned below), so the recorded
      # tree is the head tree.
      - name: Check for green run of the same tree
        id: same
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          tested=false
          for sha in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/client.yml/runs?status=success&per_page=30" --jq '.workflow_runs[] | select(.event == "push") | .head_sha'); do
            t=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${sha}" --jq '.tree.sha')
            if [ "$t" = "$tree" ]; then tested=true; break; fi
          done
          if [ "$tested" != true ]; then
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/client.yml/runs?status=success&per_page=20" --jq '.workflow_runs[].id' || true); do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" --jq '.artifacts[].name' 2>/dev/null | grep -qx "tested-tree-${tree}"; then tested=true; break; fi
            done
          fi
          echo "Same tree $tree already tested: $tested."
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.same.outputs.tested != 'true'
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.same.outputs.tested != 'true'
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        if: steps.same.outputs.tested != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('scripts/toolchain.py', 'scripts/quality.py', 'dev/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
        if: steps.same.outputs.tested != 'true'
      - run: just check
        if: steps.same.outputs.tested != 'true'
      - name: Build and verify pinned client
        if: steps.same.outputs.tested != 'true'
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: just build --out dist
      - name: Validate client release version
        if: github.ref_type == 'tag'
        run: |
          version=$(just python -c 'import tomllib; print(tomllib.load(open("pack.toml", "rb"))["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Create prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo Blockfield/blockfield-releases >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo Blockfield/blockfield-releases --title "Blockfield $GITHUB_REF_NAME" --notes "Blockfield $GITHUB_REF_NAME release in progress; notes follow shortly." --prerelease --latest=false
          fi
      - name: Publish client archives
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: |
          files=(dist/Blockfield-client.zip dist/Blockfield-prism.zip dist/Blockfield.mrpack dist/Blockfield-web.tar dist/web/build.json dist/SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" --repo Blockfield/blockfield-releases --clobber "${files[@]}"
      # Before deploy: packwiz-installer may take any file from these mirrors once the new index is live.
      # Mirrors are best effort: a file missing there comes from the next source, ultimately blockfield.pro.
      - name: Stage files for content-addressed mirrors
        if: github.ref_type == 'tag'
        run: just python scripts/mirror-files.py stage dist/web dist/mirror
      - name: Publish files to the R2 mirror
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          RCLONE_CONFIG_PACK_TYPE: s3
          RCLONE_CONFIG_PACK_PROVIDER: Cloudflare
          RCLONE_CONFIG_PACK_ACCESS_KEY_ID: ${{ secrets.R2_PACK_ACCESS_KEY_ID }}
          RCLONE_CONFIG_PACK_SECRET_ACCESS_KEY: ${{ secrets.R2_PACK_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_PACK_ENDPOINT: https://<R2_ACCOUNT_ID>.r2.cloudflarestorage.com
          RCLONE_CONFIG_PACK_NO_CHECK_BUCKET: "true"
        run: just python scripts/quality.py run rclone copy dist/mirror pack:blockfield-pack --ignore-existing --transfers 8
      - name: Publish files to the GitHub mirror
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: just python scripts/mirror-files.py github dist/mirror Blockfield/blockfield-pack-mirror files
      - name: Release text
        if: github.ref_type == 'tag'
        uses: Blockfield/blockfield-workspace/.github/actions/release-text@3cc4cface7090e3306d341341c402f3d7fe8ba0a
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_TEXT_MODEL: ${{ vars.RELEASE_TEXT_MODEL }}
          ANNOUNCEMENT_MODEL: ${{ vars.ANNOUNCEMENT_MODEL }}
        with:
          mode: release
          repository: Blockfield/blockfield-releases
          source-repository: ${{ github.repository }}
          version: ${{ github.ref_name }}
          kind: client
          out-dir: dist
          build-json: dist/web/build.json
          github-token: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
      # "Notes done" signal for ship's verify_publication: the release is not
      # promotable until this step uploads release-notes.md.
      - name: Publish release notes
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        # Upload before the edit: the bot refreshes its post on the release `edited` event and needs the assets.
        run: |
          files=(dist/release-notes.md)
          [ -f dist/announcement.json ] && files+=(dist/announcement.json)
          gh release upload "$GITHUB_REF_NAME" --repo Blockfield/blockfield-releases --clobber "${files[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo Blockfield/blockfield-releases --notes-file dist/release-notes.md
      # Records the exact tree this green run tested, so a merge whose tree a
      # green PR run already tested can skip the heavy steps (same-tree lookup
      # compares trees, so all shapes dedupe correctly).
      - name: Record tested merge tree
        id: tree
        if: github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch'
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          echo "$tree" > tested-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload tested merge tree
        if: github.event_name == 'pull_request_review' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7
          if-no-files-found: error
  release-text:
    name: ${{ (github.event_name == 'pull_request_review' && (github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'release-text (skipped review)' || 'release-text' }}
    # For a published tag whose tag run stopped before "Release text" (e.g. cancelled):
    # regenerates and publishes only the notes, never rebuilds or republishes the pack.
    if: inputs.release_text_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.release_text_tag }}
      GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Download the published build.json
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected vX.Y.Z, got $TAG"; exit 1; }
          gh release download "$TAG" --repo Blockfield/blockfield-releases --pattern build.json --dir dist/web
      - name: Release text
        uses: Blockfield/blockfield-workspace/.github/actions/release-text@3cc4cface7090e3306d341341c402f3d7fe8ba0a
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_TEXT_MODEL: ${{ vars.RELEASE_TEXT_MODEL }}
          ANNOUNCEMENT_MODEL: ${{ vars.ANNOUNCEMENT_MODEL }}
        with:
          mode: release
          repository: Blockfield/blockfield-releases
          source-repository: ${{ github.repository }}
          version: ${{ inputs.release_text_tag }}
          kind: client
          out-dir: dist
          build-json: dist/web/build.json
          github-token: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
      - name: Publish release notes
        run: |
          files=(dist/release-notes.md)
          [ -f dist/announcement.json ] && files+=(dist/announcement.json)
          gh release upload "$TAG" --repo Blockfield/blockfield-releases --clobber "${files[@]}"
          gh release edit "$TAG" --repo Blockfield/blockfield-releases --notes-file dist/release-notes.md
  deploy:
    name: ${{ (github.event_name == 'pull_request_review' && (github.event.review.user.login != 'blockfield-review-bot[bot]' || github.event.review.state != 'approved')) && 'deploy (skipped review)' || 'deploy' }}
    permissions:
      contents: read
    if: ${{ always() && needs.check.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
