name: Client pack
on:
  push:
    branches: [main]
    tags: ["v*"]
  # PR CI starts on push to the PR branch: no bot approval needed to run.
  # The bot still posts its own `bot-review` commit status, which merge
  # protection may require alongside `check` (see task report).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # No paths-ignore: a docs-only PR must still create a run so the required
    # `check` reports; `scope` gates the heavy build out instead.
  # Maintainer-only manual run: run it from the PR branch and record why.
  # Misuse is visible in the run history.
  workflow_dispatch:
    inputs:
      release_text_tag:
        description: "Published client tag (vX.Y.Z) whose notes to regenerate; never rebuilds the pack"
        required: false
        default: ""
      republish_version:
        description: "Released client tag (vX.Y.Z) whose pack files to republish to the R2 mirror; no rebuild"
        required: false
        default: ""
      reason:
        description: "Override reason (maintainers only)"
        required: true
        type: string
permissions:
  contents: read
  actions: read # main-push path looks up the green check run for this tree
  pull-requests: read # same-tree lookup reads PR metadata
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR pushes cancel superseded runs; pushes to main queue behind the running
  # one instead of cancelling it, so a merge always gets a full result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Cheap scope decision on a free runner: docs-only PRs skip the
  # network-bound build, but the run still exists so the required `check`
  # reports instead of going missing (paths-ignore would skip the run).
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: the docs-only diff needs the PR base commit.
          fetch-depth: 0
      # The build only consumes non-docs files. Only PRs may skip it (against their
      # base); pushes, tags, a failing git diff and empty diffs run the full build.
      - name: Determine docs-only scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          docs_only=false
          changed="$RUNNER_TEMP/changed"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$BASE_SHA" ] \
            && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null \
            && git diff --name-only -z --no-renames "$BASE_SHA" HEAD > "$changed" \
            && [ -s "$changed" ]; then
            docs_only=true
            while IFS= read -r -d '' f; do
              case "$f" in
                *.md | docs/* | release-notes/*) ;;
                *) docs_only=false ;;
              esac
            done < "$changed"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  # Fast, secret-free signal (~1 min: lint, format, tests, compile checks).
  # Runs beside the network-bound build instead of serially before it.
  lint:
    # Notes-regeneration dispatches skip CI; everything else
    # (main/tag pushes, PR heads, maintainer dispatches) always runs.
    if: always() && inputs.release_text_tag == '' && inputs.republish_version == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # `${{ cond && 0 || 1 }}` is always 1: 0 is falsy, and the pin check needs the tags of the range.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.lock.json', 'scripts/toolchain.py', 'scripts/toolchain_local.py', 'scripts/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - run: just check
  # Network-bound pack build (downloads every mod jar): the critical path.
  # Main pushes usually merge a tree a green PR run already tested; tags always run full.
  build:
    needs: [scope]
    # Notes-regeneration dispatches skip the build; everything else
    # (main/tag pushes, PR heads, maintainer dispatches) always runs, except
    # docs-only PRs, which the scope job gates out (pushes and tags always run full).
    if: always() && inputs.release_text_tag == '' && inputs.republish_version == '' && needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # `${{ cond && 0 || 1 }}` is always 1: 0 is falsy, and the pin check needs the tags of the range.
          fetch-depth: 0
          fetch-tags: true
      # PR runs check out the prospective merge commit, so the recorded
      # tree is the merge tree.
      - name: Check for green run of the same tree
        id: same
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          tested=false
          for sha in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/client.yml/runs?status=success&per_page=30" --jq '.workflow_runs[] | select(.event == "push") | .head_sha'); do
            t=$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${sha}" --jq '.tree.sha')
            if [ "$t" = "$tree" ]; then tested=true; break; fi
          done
          if [ "$tested" != true ]; then
            # The next->main release PR runs with head branch `next`: narrow the
            # window to it so other PRs cannot push the release run out.
            # (The push loop above keeps no branch filter: pushes to `next` run nothing.)
            for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/client.yml/runs?status=success&per_page=20&branch=next" --jq '.workflow_runs[].id' || true); do
              if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" --jq '.artifacts[].name' 2>/dev/null | grep -qx "tested-tree-${tree}"; then tested=true; break; fi
            done
          fi
          echo "Same tree $tree already tested: $tested."
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.same.outputs.tested != 'true'
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.same.outputs.tested != 'true'
        with:
          node-version: "22.23.2"
      - name: Cache pinned project tools
        if: steps.same.outputs.tested != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .cache/quality
            .dev/jdk
          key: quality-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.lock.json', 'scripts/toolchain.py', 'scripts/toolchain_local.py', 'scripts/quality.py') }}
      - run: python -I -X utf8 scripts/toolchain.py --ci
        if: steps.same.outputs.tested != 'true'
      - name: Build and verify pinned client
        if: steps.same.outputs.tested != 'true'
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: just build --out dist
      # Workshop/Game split cutover (server#233 U3): the workshop pack is a
      # lean --variant workshop build of the same tree. Tags publish it to the
      # release next to the game pack; PRs keep it as a staged artifact.
      - name: Build and verify workshop variant
        if: ${{ steps.same.outputs.tested != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: just build --out dist-workshop --variant workshop --public-base https://blockfield.pro/workshop-pack
      - name: Record workshop pack hashes
        if: ${{ steps.same.outputs.tested != 'true' }}
        run: |
          just python -c 'import json; b = json.load(open("dist-workshop/web/build.json")); print("variant:", b["variant"]); print("workshop_inputs:", b["workshop_inputs"]); print("client:", b["client"]); print("compatibility:", b["compatibility"]); l = json.load(open("dist-workshop/web/launcher.json")); print("launcher pack:", l["pack"]); print("launcher server:", l["server"])'
      - name: Upload staged workshop pack
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && steps.same.outputs.tested != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workshop-pack-staged
          path: |
            dist-workshop/Blockfield-workshop.zip
            dist-workshop/Blockfield-workshop-prism.zip
            dist-workshop/Blockfield-workshop.mrpack
            dist-workshop/web/build.json
            dist-workshop/web/pack.toml
            dist-workshop/web/index.toml
            dist-workshop/web/launcher.json
            dist-workshop/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
      - name: Validate client release version
        if: github.ref_type == 'tag'
        run: |
          version=$(just python -c 'import tomllib; print(tomllib.load(open("pack.toml", "rb"))["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Create prerelease
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo Blockfield/blockfield-releases >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo Blockfield/blockfield-releases --title "Blockfield $GITHUB_REF_NAME" --notes "Blockfield $GITHUB_REF_NAME release in progress; notes follow shortly." --prerelease --latest=false
          fi
      - name: Publish client archives
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: |
          just python scripts/mirror-files.py manifest dist/web dist/mirror-manifest.txt
          just python scripts/mirror-files.py manifest dist-workshop/web dist/workshop-manifest.txt
          sort -u dist/mirror-manifest.txt dist/workshop-manifest.txt -o dist/mirror-manifest.txt
          cp dist-workshop/web/build.json dist/workshop-build.json
          cp dist-workshop/SHA256SUMS dist/workshop-SHA256SUMS.txt
          files=(dist/Blockfield-client.zip dist/Blockfield-prism.zip dist/Blockfield.mrpack dist/Blockfield-web.tar dist/web/build.json dist/SHA256SUMS dist/mirror-manifest.txt dist-workshop/Blockfield-workshop.zip dist-workshop/Blockfield-workshop-prism.zip dist-workshop/Blockfield-workshop.mrpack dist-workshop/Blockfield-workshop-web.tar dist/workshop-build.json dist/workshop-SHA256SUMS.txt)
          gh release upload "$GITHUB_REF_NAME" --repo Blockfield/blockfield-releases --clobber "${files[@]}"
      # Before deploy: packwiz-installer may take any file from these mirrors once the new index is live.
      # Mirrors are best effort: a file missing there comes from the next source, ultimately blockfield.pro.
      # The workshop web is staged too (same content-addressed names, shared jars dedupe),
      # so the union keeps both packs installable and the manifest below retains both.
      - name: Stage files for content-addressed mirrors
        if: github.ref_type == 'tag'
        run: |
          just python scripts/mirror-files.py stage dist/web dist/mirror
          just python scripts/mirror-files.py stage dist-workshop/web dist/mirror
      - name: Publish files to the R2 mirror
        if: github.ref_type == 'tag'
        env:
          RCLONE_CONFIG_PACK_TYPE: s3
          RCLONE_CONFIG_PACK_PROVIDER: Cloudflare
          RCLONE_CONFIG_PACK_ACCESS_KEY_ID: ${{ secrets.R2_PACK_ACCESS_KEY_ID }}
          RCLONE_CONFIG_PACK_SECRET_ACCESS_KEY: ${{ secrets.R2_PACK_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_PACK_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_PACK_NO_CHECK_BUCKET: "true"
        run: just python scripts/quality.py run rclone copy dist/mirror pack:blockfield-pack --ignore-existing --transfers 8
      # R2 expires untouched objects 30 days after upload: refresh everything the
      # last releases still need so a rollback target stays downloadable (S3).
      - name: Retain last releases on the R2 mirror
        if: github.ref_type == 'tag'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
          RCLONE_CONFIG_PACK_TYPE: s3
          RCLONE_CONFIG_PACK_PROVIDER: Cloudflare
          RCLONE_CONFIG_PACK_ACCESS_KEY_ID: ${{ secrets.R2_PACK_ACCESS_KEY_ID }}
          RCLONE_CONFIG_PACK_SECRET_ACCESS_KEY: ${{ secrets.R2_PACK_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_PACK_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_PACK_NO_CHECK_BUCKET: "true"
        run: just python scripts/mirror-files.py retain --tag "$GITHUB_REF_NAME" --staged-dir dist/mirror --remote pack:blockfield-pack
      - name: Verify R2 mirror keys
        if: github.ref_type == 'tag'
        timeout-minutes: 10
        run: just python scripts/mirror-files.py verify dist/mirror-manifest.txt https://r2.blockfield.pro
      - name: Publish files to the GitHub mirror
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: just python scripts/mirror-files.py github dist/mirror Blockfield/blockfield-pack-mirror files "$GITHUB_REF_NAME"
      # Stable manifest copies for the launcher's GitHub fallback (pack.toml /
      # launcher.json are otherwise pack-host-only). The manifest release tag
      # is updated in place, never marked latest.
      - name: Publish manifests to the GitHub manifest mirror
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: |
          just python scripts/mirror-files.py manifests dist/web dist-workshop/web dist/manifests
          tag=manifest
          gh release view "$tag" --repo Blockfield/blockfield-pack-mirror >/dev/null 2>&1 \
            || gh release create "$tag" --repo Blockfield/blockfield-pack-mirror \
              --title "Manifests" --notes "Stable manifest copies for the launcher fallback; updated every release."
          gh release upload "$tag" --repo Blockfield/blockfield-pack-mirror --clobber dist/manifests/*
      # Release-time probe: every mirror in mirrors.json must serve the probe
      # file with its SHA, or the release fails before players hit a dead host.
      - name: Check published mirrors serve the probe file
        if: github.ref_type == 'tag'
        timeout-minutes: 15
        run: just python scripts/mirror-files.py check dist/web
      - name: Release text
        if: github.ref_type == 'tag'
        uses: Blockfield/blockfield-workspace/.github/actions/release-text@0388a416807af32fd784c44fe576be3b92279dce
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_TEXT_MODEL: ${{ vars.RELEASE_TEXT_MODEL }}
          ANNOUNCEMENT_MODEL: ${{ vars.ANNOUNCEMENT_MODEL }}
        with:
          mode: release
          repository: Blockfield/blockfield-releases
          source-repository: ${{ github.repository }}
          version: ${{ github.ref_name }}
          kind: client
          out-dir: dist
          build-json: dist/web/build.json
          github-token: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
      # "Notes done" signal for ship's verify_publication: the release is not
      # promotable until this step uploads release-notes.md.
      - name: Publish release notes
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        # Upload before the edit: the bot refreshes its post on the release `edited` event and needs the assets.
        run: |
          files=(dist/release-notes.md)
          [ -f dist/announcement.json ] && files+=(dist/announcement.json)
          gh release upload "$GITHUB_REF_NAME" --repo Blockfield/blockfield-releases --clobber "${files[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo Blockfield/blockfield-releases --notes-file dist/release-notes.md
      # Records the exact tree this green run tested, so a merge whose tree a
      # green PR run already tested can skip the heavy steps (same-tree lookup
      # compares trees, so all shapes dedupe correctly).
      - name: Record tested merge tree
        id: tree
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          echo "$tree" > tested-tree.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Upload tested merge tree
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-tree.txt
          retention-days: 7
          if-no-files-found: error
  # Maintainer-only backfill: republish one released version's pack files to
  # the R2 mirror from its release webs (no rebuild), then verify every key.
  # Run from any branch with republish_version=vX.Y.Z and a reason.
  republish-r2:
    name: Republish R2 mirror for a released version
    if: github.event_name == 'workflow_dispatch' && inputs.release_text_tag == '' && inputs.republish_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff741860d0648c61a # v6
        with:
          python-version: "3.12.10"
      - run: python -I -X utf8 scripts/toolchain.py --ci
      - name: Download released pack webs
        env:
          GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ inputs.republish_version }}"
          case "$version" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "republish_version must be vX.Y.Z, got: $version" >&2; exit 1 ;;
          esac
          mkdir -p republish/game republish/workshop republish/mirror
          gh release download "$version" --repo Blockfield/blockfield-releases \
            --pattern 'Blockfield-web.tar' --pattern 'Blockfield-workshop-web.tar' \
            --pattern 'mirror-manifest.txt' --dir republish --clobber
          tar -xf republish/Blockfield-web.tar -C republish/game
          tar -xf republish/Blockfield-workshop-web.tar -C republish/workshop
      - name: Republish files to the R2 mirror
        env:
          RCLONE_CONFIG_PACK_TYPE: s3
          RCLONE_CONFIG_PACK_PROVIDER: Cloudflare
          RCLONE_CONFIG_PACK_ACCESS_KEY_ID: ${{ secrets.R2_PACK_ACCESS_KEY_ID }}
          RCLONE_CONFIG_PACK_SECRET_ACCESS_KEY: ${{ secrets.R2_PACK_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_PACK_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_PACK_NO_CHECK_BUCKET: "true"
        run: |
          just python scripts/mirror-files.py stage republish/game republish/mirror
          just python scripts/mirror-files.py stage republish/workshop republish/mirror
          just python scripts/quality.py run rclone copy republish/mirror pack:blockfield-pack --ignore-existing --transfers 8
      - name: Verify R2 mirror keys
        timeout-minutes: 10
        run: just python scripts/mirror-files.py verify republish/mirror-manifest.txt https://r2.blockfield.pro
  # Single required status for branch protection: green only when both
  # parallel jobs are. No checkout: the verdict is pure needs inspection.
  check:
    name: check
    needs: [scope, lint, build]
    if: always() && inputs.release_text_tag == '' && inputs.republish_version == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require green scope, lint and build
        env:
          SCOPE: ${{ needs.scope.result }}
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only == 'true' }}
        run: |
          # `skipped` is fine only for build, and only when scope classified
          # the change as docs-only; code changes need a green build.
          [ "$SCOPE" = success ] || { echo "::error::scope result: $SCOPE"; exit 1; }
          [ "$LINT" = success ] || { echo "::error::lint result: $LINT"; exit 1; }
          if [ "$DOCS_ONLY" = true ]; then want=skipped; else want=success; fi
          [ "$BUILD" = "$want" ] || { echo "::error::build result: $BUILD, expected $want"; exit 1; }
  release-text:
    name: release-text
    # For a published tag whose tag run stopped before "Release text" (e.g. cancelled):
    # regenerates and publishes only the notes, never rebuilds or republishes the pack.
    if: inputs.release_text_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.release_text_tag }}
      GH_TOKEN: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Download the published build.json
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected vX.Y.Z, got $TAG"; exit 1; }
          gh release download "$TAG" --repo Blockfield/blockfield-releases --pattern build.json --dir dist/web
      - name: Release text
        uses: Blockfield/blockfield-workspace/.github/actions/release-text@0388a416807af32fd784c44fe576be3b92279dce
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_TEXT_MODEL: ${{ vars.RELEASE_TEXT_MODEL }}
          ANNOUNCEMENT_MODEL: ${{ vars.ANNOUNCEMENT_MODEL }}
        with:
          mode: release
          repository: Blockfield/blockfield-releases
          source-repository: ${{ github.repository }}
          version: ${{ inputs.release_text_tag }}
          kind: client
          out-dir: dist
          build-json: dist/web/build.json
          github-token: ${{ secrets.BLOCKFIELD_SOURCE_TOKEN }}
          # Regeneration is the point of this job: never reuse the published text.
          fresh: "true"
      - name: Publish release notes
        run: |
          files=(dist/release-notes.md)
          [ -f dist/announcement.json ] && files+=(dist/announcement.json)
          gh release upload "$TAG" --repo Blockfield/blockfield-releases --clobber "${files[@]}"
          gh release edit "$TAG" --repo Blockfield/blockfield-releases --notes-file dist/release-notes.md
  deploy:
    name: deploy
    permissions:
      contents: read
    if: ${{ always() && needs.check.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
